name: 'Release workflow'

concurrency:
  group: release
  cancel-in-progress: true

on:
  push:
    branches:
      - release/*

permissions: {}

jobs:
  call-shared-workflow:
    uses: $/.github/workflows/shared-workflow.yml

  deploy-staging:
    needs: call-shared-workflow
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: scalingo-community/setup-scalingo@87fe86eedc708ffb9d232c756b21f6a5784f6c8a # v0.1.1
        with:
          region: ${{ secrets.SCALINGO_REGION }}
          app_name: ${{ secrets.SCALINGO_APP }}
          api_token: ${{ secrets.SCALINGO_TOKEN }}
      - name: Deploy to Staging
        run: |
          scalingo integration-link-manual-deploy ${{ github.ref_name }}

  application-version:
    runs-on: ubuntu-latest
    needs: deploy-staging
    outputs:
      applicationVersion: ${{ steps.app_version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: '0'
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
      - name: Set application version
        id: app_version
        run: |
          APPLICATION_VERSION=$(.github/getPatchVersion.ts)
          echo "version=${APPLICATION_VERSION}" >> $GITHUB_OUTPUT

  deploy-production:
    needs: application-version
    runs-on: ubuntu-latest
    environment: production
    env:
      APPLICATION_VERSION: ${{ needs.application-version.outputs.applicationVersion }}
    steps:
      - name: Push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          default_prerelease_bump: false
          custom_tag: ${{ env.APPLICATION_VERSION }}
          tag_prefix: ''
      - uses: scalingo-community/setup-scalingo@87fe86eedc708ffb9d232c756b21f6a5784f6c8a # v0.1.1
        with:
          region: ${{ secrets.SCALINGO_REGION }}
          app_name: ${{ secrets.SCALINGO_APP }}
          api_token: ${{ secrets.SCALINGO_TOKEN }}
      - name: Deploy to Production
        run: scalingo integration-link-manual-deploy ${{ github.ref_name }}

  deploy-demo:
    needs: deploy-production
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: scalingo-community/setup-scalingo@87fe8i6eedc708ffb9d232c756b21f6a5784f6c8a # v0.1.1
        with:
          region: ${{ secrets.SCALINGO_REGION }}
          app_name: ${{ secrets.SCALINGO_APP }}
          api_token: ${{ secrets.SCALINGO_TOKEN }}
      - name: Deploy to Demo
        run: scalingo integration-link-manual-deploy ${{ github.ref_name }}
