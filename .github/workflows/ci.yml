name: 'Main workflow'

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  call-shared-workflow:
    uses: $/.github/workflows/shared-workflow.yml

  deploy-development:
    needs: call-shared-workflow
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: scalingo-community/setup-scalingo@fa1a5f8a4ae990609b6f863d675ace8a8efe803a # v0.1.2
        with:
          region: ${{ secrets.SCALINGO_REGION }}
          app_name: ${{ secrets.SCALINGO_APP }}
          api_token: ${{ secrets.SCALINGO_TOKEN }}
      - name: Deploy to Development
        run: scalingo integration-link-manual-deploy main
